<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helius Wallet Tracker - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 450px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #4f46e5;
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .logo p {
            color: #6b7280;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #374151;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            text-align: center;
        }

        .message.error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .message.success {
            background: #d1fae5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .links {
            margin-top: 20px;
            text-align: center;
        }

        .links a {
            color: #4f46e5;
            text-decoration: none;
            font-size: 0.9rem;
            margin: 0 10px;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .status {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            background: #f3f4f6;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #6b7280;
        }

        .status.logged-in {
            background: #d1fae5;
            color: #047857;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🔐 Helius Tracker</h1>
            <p>Admin Login</p>
        </div>

        <div id="message"></div>

        <div id="loginForm">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username" placeholder="Enter username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter password">
                </div>

                <button type="submit" class="btn" id="loginBtn">Login</button>
            </form>
        </div>

        <div id="loggedInView" style="display: none;">
            <div class="status logged-in">
                ✓ Logged in as <strong id="currentUser"></strong>
            </div>
            <button onclick="handleLogout()" class="btn" style="margin-top: 20px;">Logout</button>
        </div>

        <div class="links">
            <a href="test.html">Endpoint Testing</a>
            <a href="realtime-test.html">Realtime Console</a>
            <a href="coordinated-trades-live.html">Live Monitor</a>
        </div>
    </div>

    <script>
        // Try to detect the correct API URL
        // If on localhost:5500 (Live Server), use localhost:8080
        // Otherwise use the current origin
        const API_BASE = (window.location.port === '5500' || window.location.port === '3000') 
            ? 'http://localhost:8080' 
            : window.location.origin;

        console.log('API_BASE:', API_BASE);

        // Check if already logged in
        async function checkAuth() {
            const token = localStorage.getItem('jwt_token');
            if (!token) return;

            try {
                const response = await fetch(`${API_BASE}/api/auth/me`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    showLoggedInView(data.user?.username || data.username || 'User');
                } else {
                    localStorage.removeItem('jwt_token');
                }
            } catch (error) {
                console.error('Auth check failed:', error);
                localStorage.removeItem('jwt_token');
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';
            clearMessage();

            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                console.log('Login response:', data);

                if (response.ok && data.token) {
                    localStorage.setItem('jwt_token', data.token);
                    const username = data.user?.username || data.username || 'User';
                    showMessage('Login successful!', 'success');
                    setTimeout(() => {
                        showLoggedInView(username);
                    }, 500);
                } else {
                    showMessage(data.error || 'Login failed', 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showMessage('Connection error. Please try again.', 'error');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        }

        async function handleLogout() {
            const token = localStorage.getItem('jwt_token');
            
            try {
                await fetch(`${API_BASE}/api/auth/logout`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
            } catch (error) {
                console.error('Logout error:', error);
            }

            localStorage.removeItem('jwt_token');
            showLoginForm();
            showMessage('Logged out successfully', 'success');
        }

        function showLoggedInView(username) {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('loggedInView').style.display = 'block';
            document.getElementById('currentUser').textContent = username;
        }

        function showLoginForm() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('loggedInView').style.display = 'none';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
        }

        function clearMessage() {
            document.getElementById('message').style.display = 'none';
        }

        // Initialize
        checkAuth();
    </script>
</body>
</html>
