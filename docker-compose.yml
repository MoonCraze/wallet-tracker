services:
  helius-tracker:
    build: .
    ports:
      - "8080:8080"  # Map container port 8080 to host port 8080
    environment:
      - NODE_ENV=production
      - PORT=8080
      # PostgreSQL connection (use your external database URL)
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL:-${DATABASE_URL}}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-super-secret-change-me}
      - HELIUS_API_KEY=${HELIUS_API_KEY}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - EXCLUDE_TOKENS=${EXCLUDE_TOKENS:-So11111111111111111111111111111111111111112}
      - MIN_AMOUNT=${MIN_AMOUNT:-1}
      - DEDUP_BY_SIGNATURE_ONLY=${DEDUP_BY_SIGNATURE_ONLY:-0}
      - DEBUG_EVENTS=${DEBUG_EVENTS:-0}
      - DEBUG_EVENTS_VERBOSE=${DEBUG_EVENTS_VERBOSE:-0}
      - COORDINATED_WINDOW_MINUTES=${COORDINATED_WINDOW_MINUTES:-5}
      - COORDINATED_MIN_WALLETS=${COORDINATED_MIN_WALLETS:-3}
      - ALLOW_DEV_ENDPOINTS=${ALLOW_DEV_ENDPOINTS:-0}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - WALLETS_API_ENDPOINT=${WALLETS_API_ENDPOINT}
      # Authentication
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin@123}
    volumes:
      - helius_logs:/app/logs  # Persist logs only (database is external PostgreSQL)
      - ./src/wallets.json:/app/src/wallets.json  # Persist wallet list
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./Cloudfare/cloudflared-config.yml:/etc/cloudflared/config.yml:ro
      - ./Cloudfare/c8e67b13-2249-4281-8170-7744ff8fdfa2.json:/etc/cloudflared/credentials.json:ro
    restart: unless-stopped
    depends_on:
      - helius-tracker
    networks:
      - default

volumes:
  helius_logs:
    driver: local
